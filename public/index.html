<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Cam 🐶</title>
  <style>
    [hidden] { display: none !important; }
    body { margin: 0; padding: 16px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    #loginForm { max-width: 320px; margin: 15vh auto 0; }
    video { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 4/3; object-fit: contain; }
    input, select, button { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #1d1d1d; color: #eee; }
    button { border: none; cursor: pointer; background: #1565c0; }
    #startBtn { background: #2e7d32; }
    #stopBtn { background: #c62828; }
    #soundBtn { background: #f9a825; color: #111; }
    #logoutBtn { background: #333; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    #status { color: #aaa; min-height: 1.4em; }
    #loginError { color: #ef5350; min-height: 1.2em; }
  </style>
</head>
<body>
  <!-- Экран входа -->
  <form id="loginForm" class="wrap">
    <h2>🐶 Dog Cam</h2>
    <input id="login" placeholder="Логин" autocomplete="username" autocapitalize="off" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <div id="loginError"></div>
  </form>

  <!-- Основной экран: и просмотр, и трансляция -->
  <div id="main" class="wrap" hidden>
    <video id="video" autoplay muted playsinline></video>
    <button id="soundBtn" hidden>🔊 Включить звук</button>
    <div id="status"></div>
    <div id="startBox" class="row" hidden>
      <select id="camera">
        <option value="environment">Основная камера</option>
        <option value="user">Фронтальная камера</option>
      </select>
      <button id="startBtn">Начать трансляцию</button>
    </div>
    <button id="stopBtn" hidden>Остановить трансляцию</button>
    <button id="logoutBtn">Выйти</button>
  </div>

  <!-- Если запущен локальный server.js — подтянется socket.io, а на GitHub Pages автоматически включится встроенный WebSocket-сигналинг -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const RETRY_BASE_MS = 3000; // первая пауза перед повтором
    const RETRY_MAX = 10;       // после стольких неудач стример сдаётся
    // SHA-256 от 'auth:<login>:<password>' — сам логин и пароль в коде не хранятся
    const AUTH_HASH = '971ae3f90682598853f30f2f8f58af94b60a0f3bbd66bc4035aba2b2e3f9dc5f';
    const $ = (id) => document.getElementById(id);
    const setStatus = (t) => ($('status').textContent = t);
    const video = $('video');

    // Нативный бессерверный сигналинг поверх публичного MQTT WebSocket (для работы прямо с GitHub Pages)
    function createCloudSocket({ auth }) {
      const enc = new TextEncoder(), dec = new TextDecoder();
      const strBuf = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
      const pkt = (type, body) => {
        let len = body.length, rem = [];
        do { let d = len % 128; len = (len / 128) | 0; if (len > 0) d |= 128; rem.push(d); } while (len > 0);
        return new Uint8Array([type, ...rem, ...body]);
      };
      const sha256 = async (str) => {
        const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      };

      const handlers = {};
      const fire = (ev, data) => (handlers[ev] || []).forEach((fn) => fn(data));
      const myId = Math.random().toString(36).slice(2, 10);
      // Имя канала вычисляется в памяти из введённых логина и пароля — в исходном коде его нет
      let base = '', stateTopic = '', msgTopic = '';

      let ws = null, pingTimer = null, stateTimer = null, reconnTimer = null;
      let autoReconn = true, hasWill = false, wantBroadcast = false, gotInit = false;
      let remoteBroadcasterId = null, isBroadcaster = false;

      const pub = (topic, obj, retain = false) => {
        if (ws?.readyState === 1) ws.send(pkt(0x30 | (retain ? 1 : 0), [...strBuf(topic), ...enc.encode(JSON.stringify(obj))]));
      };

      async function checkAuth() {
        const creds = `${auth?.login || ''}:${auth?.password || ''}`;
        if ((await sha256('auth:' + creds)) !== AUTH_HASH) return false;
        base = 'dogcam/' + (await sha256('stream-channel:' + creds)).slice(0, 32);
        stateTopic = base + '/state';
        msgTopic = base + '/msg';
        return true;
      }

      function cleanup(clean = false) {
        clearInterval(pingTimer);
        clearTimeout(stateTimer);
        if (ws) {
          ws.onclose = ws.onerror = ws.onmessage = ws.onopen = null;
          if (clean && ws.readyState === 1) try { ws.send(new Uint8Array([0xe0, 0])); } catch (e) {}
          try { ws.close(); } catch (e) {}
          ws = null;
        }
        sock.connected = false;
      }

      async function open(withWill = wantBroadcast) {
        cleanup();
        clearTimeout(reconnTimer);
        if (!(await checkAuth())) return setTimeout(() => fire('connect_error', { message: 'auth' }), 0);

        hasWill = withWill;
        gotInit = false;
        const s = new WebSocket('wss://broker.emqx.io:8084/mqtt', 'mqtt');
        s.binaryType = 'arraybuffer';
        ws = s;

        s.onopen = () => {
          // Если это стример — ставим Last Will: при обрыве связи брокер сам запишет {live:false}
          const flags = withWill ? 0x26 : 0x02;
          const will = withWill ? [...strBuf(stateTopic), ...strBuf(JSON.stringify({ live: false }))] : [];
          s.send(pkt(0x10, [0, 4, 77, 81, 84, 84, 4, flags, 0, 15, ...strBuf('dc-' + myId), ...will]));
        };

        s.onmessage = ({ data }) => {
          const u = new Uint8Array(data);
          let i = 0;
          while (i < u.length) {
            const type = u[i++];
            let mul = 1, len = 0, b;
            do { b = u[i++]; len += (b & 127) * mul; mul *= 128; } while (b & 128);
            const end = i + len;
            if (type === 0x20) {
              s.send(pkt(0x82, [0, 1, ...strBuf(base + '/#'), 0]));
            } else if (type === 0x90) {
              sock.connected = true;
              pingTimer = setInterval(() => s.readyState === 1 && s.send(new Uint8Array([0xc0, 0])), 10000);
              if (wantBroadcast) {
                isBroadcaster = true;
                remoteBroadcasterId = myId;
                pub(stateTopic, { live: true, broadcasterId: myId }, true);
                fire('broadcast-ok');
              } else {
                stateTimer = setTimeout(() => { if (!gotInit) { gotInit = true; fire('state', { live: false }); } }, 400);
              }
              fire('connect');
            } else if ((type & 0xf0) === 0x30) {
              const tLen = (u[i] << 8) | u[i + 1];
              const topic = dec.decode(u.subarray(i + 2, i + 2 + tLen));
              const pStart = i + 2 + tLen + (((type >> 1) & 3) ? 2 : 0);
              const msg = JSON.parse(dec.decode(u.subarray(pStart, end)));
              if (topic === stateTopic) {
                clearTimeout(stateTimer);
                const wasInit = gotInit;
                gotInit = true;
                if (msg.live && msg.broadcasterId) {
                  if (isBroadcaster && msg.broadcasterId !== myId) {
                    isBroadcaster = wantBroadcast = false;
                    fire('error-msg', 'Трансляцию перехватило другое устройство');
                  }
                  remoteBroadcasterId = msg.broadcasterId;
                  if (!isBroadcaster) fire(wasInit ? 'broadcast-started' : 'state', { live: true });
                } else {
                  remoteBroadcasterId = null;
                  if (!isBroadcaster) fire(wasInit ? 'broadcaster-left' : 'state', { live: false });
                }
              } else if (topic === msgTopic && msg.to === myId) {
                if (msg.type === 'viewer-joined') fire('viewer-joined', { viewerId: msg.viewerId });
                else if (msg.type === 'viewer-left') fire('viewer-left', { viewerId: msg.viewerId });
                else if (msg.type === 'signal') fire('signal', { from: msg.from, data: msg.data });
              }
            }
            i = end;
          }
        };

        const onFail = () => {
          const wasConn = sock.connected;
          cleanup();
          if (wasConn) fire('disconnect', 'transport close');
          else fire('connect_error', { message: 'net' });
          if (autoReconn) reconnTimer = setTimeout(() => open(wantBroadcast), 2000);
        };
        s.onerror = onFail;
        s.onclose = onFail;
      }

      const sock = {
        id: myId,
        connected: false,
        io: { reconnection: (v) => { autoReconn = v; if (!v) clearTimeout(reconnTimer); } },
        on: (ev, fn) => ((handlers[ev] = handlers[ev] || []).push(fn), sock),
        connect: () => open(wantBroadcast),
        disconnect: () => {
          autoReconn = false;
          clearTimeout(reconnTimer);
          if (!isBroadcaster && remoteBroadcasterId) pub(msgTopic, { to: remoteBroadcasterId, type: 'viewer-left', viewerId: myId });
          cleanup(true);
          fire('disconnect', 'io client disconnect');
        },
        emit: (ev, data) => {
          if (ev === 'start-broadcast') {
            wantBroadcast = true;
            if (!hasWill || !sock.connected) return open(true);
            isBroadcaster = true;
            remoteBroadcasterId = myId;
            pub(stateTopic, { live: true, broadcasterId: myId }, true);
            fire('broadcast-ok');
          } else if (ev === 'stop-broadcast') {
            wantBroadcast = false;
            if (isBroadcaster) { isBroadcaster = false; pub(stateTopic, { live: false }, true); }
          } else if (ev === 'watch') {
            if (!remoteBroadcasterId) return fire('state', { live: false });
            fire('joined', { broadcasterId: remoteBroadcasterId });
            pub(msgTopic, { to: remoteBroadcasterId, type: 'viewer-joined', viewerId: myId });
          } else if (ev === 'signal' && data?.to) {
            pub(msgTopic, { to: data.to, type: 'signal', from: myId, data: data.data });
          }
        },
      };
      open(false);
      return sock;
    }

    let socket = null;
    let live = false;          // идёт ли трансляция на сервере
    // --- зритель ---
    let pc = null;
    let broadcasterId = null;
    let viewerTimer = null;
    // --- стример ---
    let wantStream = false;    // нажали «Начать» и ещё не нажали «Стоп» => это устройство — стример
    let onAir = false;         // сервер подтвердил эфир на текущем соединении
    let localStream = null;
    let peers = {};            // viewerId -> RTCPeerConnection
    let attempt = 0;
    let streamTimer = null;
    let wakeLock = null;

    function updateUI() {
      $('startBox').hidden = wantStream || live;
      $('stopBtn').hidden = !wantStream;
      if (wantStream) $('soundBtn').hidden = true;
    }

    function showLogin(error = '') {
      $('main').hidden = true;
      $('loginForm').hidden = false;
      $('loginError').textContent = error;
    }

    // ---------- Вход ----------
    $('loginForm').onsubmit = (e) => {
      e.preventDefault();
      connect($('login').value.trim(), $('password').value);
    };

    function connect(login, password) {
      if (socket) socket.disconnect();
      const opts = { auth: { login, password }, reconnectionDelay: 2000, reconnectionDelayMax: 5000 };
      // Если открыто через Node-сервер — используем Socket.IO, если с GitHub Pages — встроенный WebSocket
      socket = typeof io === 'function' ? io(opts) : createCloudSocket(opts);

      socket.on('connect', () => {
        localStorage.setItem('dogcam', JSON.stringify({ login, password })); // чтобы не вводить заново
        $('loginForm').hidden = true;
        $('main').hidden = false;
        if (wantStream) goLive(); // стример вернулся в сеть — снова объявляем эфир
      });

      socket.on('connect_error', (err) => {
        if (err.message === 'auth') {
          socket.disconnect();
          localStorage.removeItem('dogcam');
          return showLogin('Неверный логин или пароль');
        }
        if (wantStream) retry('Нет интернета');
        else setStatus('Нет связи с сервером, переподключаюсь...');
      });

      socket.on('disconnect', (reason) => {
        if (reason === 'io client disconnect') return; // сами вышли
        onAir = false;
        if (wantStream) return retry('Связь с сервером потеряна');
        closePeer();
        setStatus('Нет связи с сервером, переподключаюсь...');
      });

      // ---------- Состояние трансляции ----------
      socket.on('state', ({ live: l }) => {
        live = l;
        if (!wantStream) live ? watch() : idle();
      });
      socket.on('broadcast-started', () => { live = true; if (!wantStream) watch(); });
      socket.on('broadcaster-left', () => { live = false; if (!wantStream) idle(); });
      socket.on('error-msg', (msg) => stopBroadcasting(msg));

      // ---------- Стример ----------
      socket.on('broadcast-ok', () => {
        onAir = true;
        live = true;
        attempt = 0; // успех — счётчик ретраев с нуля
        clearTimeout(streamTimer);
        streamTimer = null;
        updateCount();
      });

      socket.on('viewer-joined', async ({ viewerId }) => {
        if (!wantStream || !localStream) return;
        if (peers[viewerId]) peers[viewerId].close();
        const p = new RTCPeerConnection(ICE);
        peers[viewerId] = p;
        localStream.getTracks().forEach((t) => p.addTrack(t, localStream)); // видео + звук
        p.onicecandidate = ({ candidate }) => {
          if (candidate) socket.emit('signal', { to: viewerId, data: { type: 'ice', candidate } });
        };
        p.onconnectionstatechange = () => {
          if (p.connectionState === 'failed' && peers[viewerId] === p) removeViewer(viewerId);
          updateCount();
        };
        await p.setLocalDescription(await p.createOffer());
        socket.emit('signal', { to: viewerId, data: { type: 'offer', sdp: p.localDescription } });
      });

      socket.on('viewer-left', ({ viewerId }) => removeViewer(viewerId));

      // ---------- Сигналы WebRTC (общие для обеих ролей) ----------
      socket.on('signal', async ({ from, data }) => {
        try {
          if (wantStream) {
            const p = peers[from];
            if (!p) return;
            if (data.type === 'answer') await p.setRemoteDescription(data.sdp);
            else if (data.type === 'ice') await p.addIceCandidate(data.candidate);
          } else {
            if (!pc || from !== broadcasterId) return;
            if (data.type === 'offer') {
              await pc.setRemoteDescription(data.sdp);
              await pc.setLocalDescription(await pc.createAnswer());
              socket.emit('signal', { to: from, data: { type: 'answer', sdp: pc.localDescription } });
            } else if (data.type === 'ice') await pc.addIceCandidate(data.candidate);
          }
        } catch (e) { /* устаревший сигнал от закрытого соединения — игнорируем */ }
      });

      // ---------- Зритель ----------
      socket.on('joined', ({ broadcasterId: id }) => {
        broadcasterId = id;
        closePeer();
        pc = new RTCPeerConnection(ICE);
        pc.ontrack = (e) => {
          if (video.srcObject === e.streams[0]) return;
          video.srcObject = e.streams[0];
          setStatus('🔴 В эфире');
          playWithSound();
        };
        pc.onicecandidate = ({ candidate }) => {
          if (candidate) socket.emit('signal', { to: broadcasterId, data: { type: 'ice', candidate } });
        };
        // 🔄 Автопереподключение зрителя
        pc.onconnectionstatechange = () => {
          if (['disconnected', 'failed'].includes(pc.connectionState)) {
            setStatus('Связь потеряна, переподключаюсь...');
            closePeer();
            viewerTimer = setTimeout(() => { if (live && !wantStream) watch(); }, 3000);
          }
        };
        setStatus('Ждём видео...');
      });
    }

    function watch() {
      setStatus('Подключаюсь к трансляции...');
      updateUI();
      socket.emit('watch');
    }

    function idle() {
      closePeer();
      video.srcObject = null;
      $('soundBtn').hidden = true;
      setStatus('Трансляции сейчас нет. Видео появится само, как только она начнётся.');
      updateUI();
    }

    function closePeer() {
      clearTimeout(viewerTimer);
      if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
    }

    async function playWithSound() {
      video.muted = false;
      try {
        await video.play();
        $('soundBtn').hidden = true;
      } catch (e) {
        video.muted = true;
        video.play().catch(() => {});
        $('soundBtn').hidden = false;
      }
    }
    $('soundBtn').onclick = () => { video.muted = false; video.play(); $('soundBtn').hidden = true; };

    // ---------- Трансляция ----------
    async function acquireMedia() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: $('camera').value, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true },
      });
      if (localStream) localStream.getTracks().forEach((t) => t.stop());
      localStream = stream;
      stream.getTracks().forEach((t) => (t.onended = () => retry('Камера или микрофон отключились')));
      video.muted = true;
      video.srcObject = stream;
    }

    $('startBtn').onclick = async () => {
      try {
        await acquireMedia();
      } catch (e) {
        const reasons = { NotAllowedError: 'нет разрешения на камеру/микрофон', NotFoundError: 'камера или микрофон не найдены', NotReadableError: 'камера занята другим приложением' };
        const insecure = !window.isSecureContext ? ' (нужен HTTPS)' : '';
        return setStatus('Ошибка: ' + (reasons[e.name] || e.message) + insecure);
      }
      wantStream = true;
      attempt = 0;
      socket.io.reconnection(false);
      closePeer();
      $('soundBtn').hidden = true;
      keepAwake();
      updateUI();
      goLive();
    };

    async function goLive() {
      clearTimeout(streamTimer);
      streamTimer = null;
      if (!wantStream) return;
      if (!localStream || localStream.getTracks().some((t) => t.readyState === 'ended')) {
        try { await acquireMedia(); } catch (e) { return retry('Камера недоступна'); }
        closeAllPeers();
        onAir = false;
      }
      if (!socket.connected) return socket.connect();
      if (!onAir) socket.emit('start-broadcast');
    }

    // 🔄 Цикл ретраев стримера: паузы 3, 6, 12, 24... с (экспонента), до 10 попыток
    function retry(reason) {
      if (!wantStream || streamTimer) return;
      if (attempt >= RETRY_MAX) {
        stopBroadcasting(`❌ Не удалось восстановить трансляцию за ${RETRY_MAX} попыток. Нажмите «Начать» снова.`);
        return socket.connect();
      }
      const delay = RETRY_BASE_MS * 2 ** attempt++;
      setStatus(`⚠️ ${reason}. Попытка ${attempt}/${RETRY_MAX} через ${delay / 1000} с...`);
      streamTimer = setTimeout(goLive, delay);
    }

    window.addEventListener('online', () => { if (wantStream && !onAir) goLive(); });

    function stopBroadcasting(msg) {
      if (socket?.connected) socket.emit('stop-broadcast');
      wantStream = false;
      onAir = false;
      attempt = 0;
      clearTimeout(streamTimer);
      streamTimer = null;
      if (socket) socket.io.reconnection(true);
      if (localStream) localStream.getTracks().forEach((t) => t.stop());
      localStream = null;
      closeAllPeers();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      live = false;
      idle();
      if (msg) setStatus(msg);
    }

    $('stopBtn').onclick = () => stopBroadcasting();

    $('logoutBtn').onclick = () => {
      stopBroadcasting();
      closePeer();
      socket.disconnect();
      socket = null;
      localStorage.removeItem('dogcam');
      showLogin();
    };

    function closeAllPeers() {
      Object.values(peers).forEach((p) => p.close());
      peers = {};
    }

    function removeViewer(viewerId) {
      if (peers[viewerId]) { peers[viewerId].close(); delete peers[viewerId]; }
      updateCount();
    }

    function updateCount() {
      if (!wantStream || !onAir) return;
      const n = Object.values(peers).filter((p) => p.connectionState === 'connected').length;
      setStatus(`🔴 Идёт трансляция. Зрителей: ${n}`);
    }

    async function keepAwake() {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (wantStream && document.visibilityState === 'visible') keepAwake();
    });

    const saved = JSON.parse(localStorage.getItem('dogcam') || 'null');
    if (saved) connect(saved.login, saved.password);
  </script>
</body>
</html>
